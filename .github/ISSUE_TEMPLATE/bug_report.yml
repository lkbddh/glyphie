name: Bug report
description: Something in Glyphie does not work as it should.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Glyphie version
      description: Shown on the Settings page in the app.
      placeholder: "0.3.1"
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How you installed it
      options:
        - .deb package
        - Flatpak
        - From source (just install)
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Distribution and COSMIC version
      placeholder: "Pop!_OS 24.04, COSMIC epoch 1"
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Debug log
      description: |
        Close Glyphie if it is open (a second launch only focuses the running window), then start it from a terminal with `RUST_LOG=glyphie=debug glyphie` (Flatpak: `flatpak run --env=RUST_LOG=glyphie=debug com.lkbddh.Glyphie`), reproduce the problem in that window, and paste the output.
      render: text
