[package]
name = "glyphie"
version = "0.2.1"
edition = "2021"
rust-version = "1.89"
description = "Glyphie - Emoji Picker with skin tone, multiselect and gender support"
license = "GPL-3.0-or-later"
repository = "https://github.com/lkbddh/glyphie"

[dependencies]
libcosmic = { git = "https://github.com/pop-os/libcosmic", rev = "a9f64c33ce9159485be5dad1ce07ccf7c12399d5", default-features = false, features = ["a11y", "single-instance", "tokio", "wayland", "winit"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
indexmap = "2.7"
log = "0.4"
env_logger = "0.11"
i18n-embed = { version = "0.15", features = ["fluent-system", "desktop-requester"] }
i18n-embed-fl = "0.9"
rust-embed = "8.5"

[features]
default = ["wgpu"]
wgpu = ["libcosmic/wgpu"]

[[bin]]
name = "glyphie"
path = "src/main.rs"

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
strip = true
panic = "abort"

[profile.dev]
opt-level = 0
debug = false

[profile.dev.package."*"]
opt-level = 2
