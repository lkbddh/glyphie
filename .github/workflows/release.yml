name: Release

# A version tag builds the .deb and the Flatpak bundle and attaches them to its
# GitHub release. Pull requests that touch packaging build both without publishing.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - justfile
      - Cargo.toml
      - Cargo.lock
      - cargo-sources.json
      - com.lkbddh.Glyphie.*
      - icons/**
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - id: version
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi

  deb:
    needs: version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libdrm-dev libwayland-dev libxkbcommon-dev dpkg-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - uses: Swatinem/rust-cache@v2
      - run: just build-release && just deb
      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: target/deb/*.deb
          if-no-files-found: error

  flatpak:
    needs: version
    runs-on: ubuntu-24.04
    env:
      BUNDLE: glyphie-${{ needs.version.outputs.version }}.flatpak
    steps:
      - uses: actions/checkout@v5
      - name: Install flatpak-builder
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends flatpak flatpak-builder elfutils
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
      - name: Build the bundle
        run: |
          flatpak-builder --user --install-deps-from=flathub --disable-rofiles-fuse \
            --force-clean --repo=repo build-dir com.lkbddh.Glyphie.yml
          flatpak build-bundle repo "$BUNDLE" com.lkbddh.Glyphie \
            --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo
      - uses: actions/upload-artifact@v4
        with:
          name: flatpak
          path: ${{ env.BUNDLE }}
          if-no-files-found: error

  # Automation only stages a draft. A person publishes it after the smoke tests,
  # and a published release's files are never replaced.
  publish:
    if: github.ref_type == 'tag'
    needs: [version, deb, flatpak]
    runs-on: ubuntu-24.04
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - run: sha256sum *.deb *.flatpak > SHA256SUMS
      - name: Attach to the draft release
        run: |
          is_draft=$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null || echo absent)
          if [ "$is_draft" = absent ]; then
            gh release create "$TAG" *.deb *.flatpak SHA256SUMS --draft \
              --title "Glyphie ${{ needs.version.outputs.version }}" \
              --notes "Release notes to follow."
          elif [ "$is_draft" = true ]; then
            gh release upload "$TAG" *.deb *.flatpak SHA256SUMS --clobber
          else
            echo "::error::Release $TAG is already published; its files are left untouched."
            exit 1
          fi
